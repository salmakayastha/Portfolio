<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Salma Kayastha logo">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7e3a0"/>
      <stop offset="100%" stop-color="#4a7c59"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#88d07e"/>
      <stop offset="100%" stop-color="#2d5016"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2d5016" flood-opacity="0.25"/>
    </filter>
    <clipPath id="circleClip">
      <circle cx="48" cy="48" r="40"/>
    </clipPath>
  </defs>

  <!-- Outer subtle ring -->
  <circle cx="48" cy="48" r="44" fill="#f4fbf4" stroke="url(#ring)" stroke-width="2"/>

  <!-- Inner badge with shadow -->
  <g filter="url(#softShadow)">
    <circle cx="48" cy="48" r="38" fill="#ffffff"/>
  </g>

  <!-- Leaf accent -->
  <g clip-path="url(#circleClip)" opacity="0.95">
    <path d="M64 20c-9 2-16 7-20 14-3 5-4 11-4 16-5-4-8-9-9-15-1-6 1-12 5-16 6-6 13-9 21-9 3 0 5 0 7 1z" fill="url(#leaf)"/>
  </g>

  <!-- Monogram SK -->
  <g transform="translate(0,2)">
    <text x="48" y="60" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="28" text-anchor="middle" fill="#2d5016" letter-spacing="1.5">S</text>
    <text x="60" y="60" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="28" text-anchor="middle" fill="#4a7c59" letter-spacing="1.5">K</text>
  </g>

  <!-- Small underline detail -->
  <path d="M30 66 Q48 72 66 66" fill="none" stroke="#cfe8cf" stroke-width="3" stroke-linecap="round"/>
</svg>

